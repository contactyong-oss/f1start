<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>미국 출장 가능성 지표</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #17191c;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        sans-serif;
    }

    .container {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 60px 0 80px;
    }

    .header {
      margin-bottom: 28px;
    }

    .header .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #777;
      margin-bottom: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.04em;
    }

    /* SCORE */

    .score-card {
      background: #fff;
      border: 1px solid #e2e4e7;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.04);
    }

    .score-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .score {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .score-number {
      font-size: 82px;
      font-weight: 800;
      letter-spacing: -0.07em;
      line-height: 1;
    }

    .score-percent {
      font-size: 30px;
      font-weight: 700;
    }

    .score-bar {
      height: 12px;
      background: #e8eaed;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 24px;
    }

    .score-fill {
      height: 100%;
      width: 0%;
      background: #17191c;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .score-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    .status {
      font-size: 14px;
      font-weight: 700;
    }

    .change {
      color: #777;
      font-size: 13px;
    }

    /* SECTION */

    .section {
      margin-top: 32px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    /* INCIDENT */

    .incident-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .incident {
      background: #fff;
      border: 1px solid #e2e4e7;
      border-radius: 14px;
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      animation: incidentIn 0.3s ease-out;
    }

    @keyframes incidentIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .incident-left {
      min-width: 0;
    }

    .incident-time {
      font-size: 11px;
      color: #999;
      margin-bottom: 5px;
    }

    .incident-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .incident-score {
      white-space: nowrap;
      font-size: 14px;
      font-weight: 800;
    }

    .positive {
      color: #111;
    }

    /* EMPTY */

    .empty-state {
      background: #fff;
      border: 1px solid #e2e4e7;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    /* BUTTON */

    .add-button {
      width: 100%;
      margin-top: 12px;
      padding: 17px;
      border: 1px dashed #b8bbc0;
      background: transparent;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #555;
      transition: 0.2s;
    }

    .add-button:hover {
      background: #fff;
      border-color: #777;
    }

    /* RESET */

    .reset-area {
      text-align: center;
      margin-top: 25px;
    }

    .reset-button {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(400px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.2);
      animation: modalIn 0.2s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .lock {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .modal h2 {
      margin: 0;
      font-size: 20px;
    }

    .modal-description {
      margin: 8px 0 24px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 1px solid #d7d9dd;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .auth-button,
    .register-button {
      width: 100%;
      border: 0;
      background: #17191c;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      margin-top: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .auth-error {
      height: 18px;
      margin-top: 8px;
      font-size: 12px;
      color: #c62828;
    }

    .close-button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 10px;
      margin-top: 4px;
      color: #888;
      cursor: pointer;
    }

    /* CONFIRMED */

    .confirmed {
      display: none;
      margin-top: 28px;
      padding: 28px;
      border-radius: 16px;
      background: #17191c;
      color: #fff;
      text-align: center;
    }

    .confirmed.show {
      display: block;
    }

    .confirmed-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .confirmed-title {
      font-size: 22px;
      font-weight: 800;
    }

    .confirmed-text {
      margin-top: 8px;
      font-size: 13px;
      color: #bbb;
    }

    @media (max-width: 600px) {

      .container {
        padding-top: 35px;
      }

      .score-card {
        padding: 28px;
      }

      .score-number {
        font-size: 64px;
      }

      .incident {
        padding: 15px;
      }

    }
  </style>
</head>


<body>

<main class="container">

  <header class="header">
    <div class="eyebrow">
      CONFIDENTIAL / INTERNAL ANALYSIS
    </div>

    <h1>
      🇺🇸 미국 출장 가능성 지표
    </h1>
  </header>


  <!-- SCORE -->

  <section class="score-card">

    <div class="score-label">
      현재 미국 출장 가능성
    </div>

    <div class="score">

      <div
        class="score-number"
        id="scoreNumber"
      >
        0.0
      </div>

      <div class="score-percent">
        %
      </div>

    </div>


    <div class="score-bar">

      <div
        class="score-fill"
        id="scoreFill"
      ></div>

    </div>


    <div class="score-status">

      <div
        class="status"
        id="scoreStatus"
      >
        아직 가능성은 낮음
      </div>

      <div
        class="change"
        id="scoreChange"
      >
        현재까지 +0.0%
      </div>

    </div>

  </section>


  <!-- INCIDENTS -->

  <section class="section">

    <div class="section-title">
      최근 감지된 정황
    </div>


    <div
      class="incident-list"
      id="incidentList"
    ></div>


    <button
      class="add-button"
      onclick="openAuth()"
    >
      ＋ 새로운 정황 추가
    </button>

  </section>


  <!-- CONFIRMED -->

  <div
    class="confirmed"
    id="confirmed"
  >

    <div class="confirmed-icon">
      🇺🇸✈️
    </div>

    <div class="confirmed-title">
      미국 출장 확정
    </div>

    <div class="confirmed-text">
      더 이상의 분석이 필요하지 않습니다.
    </div>

  </div>


  <!-- RESET -->

  <div class="reset-area">

    <button
      class="reset-button"
      onclick="openResetAuth()"
    >
      데이터 초기화
    </button>

  </div>

</main>


<!-- PASSWORD MODAL -->

<div
  class="modal-backdrop"
  id="authModal"
>

  <div class="modal">

    <div class="lock">
      🔒
    </div>

    <h2>
      ACCESS REQUIRED
    </h2>

    <div class="modal-description">
      새로운 정황을 등록하려면<br>
      인증이 필요합니다.
    </div>

    <label class="field-label">
      PASSWORD
    </label>

    <input
      type="password"
      id="passwordInput"
      autocomplete="off"
      onkeydown="if(event.key === 'Enter') authenticate()"
    />

    <div
      class="auth-error"
      id="authError"
    ></div>

    <button
      class="auth-button"
      onclick="authenticate()"
    >
      인증
    </button>

    <button
      class="close-button"
      onclick="closeAuth()"
    >
      취소
    </button>

  </div>

</div>


<!-- INCIDENT MODAL -->

<div
  class="modal-backdrop"
  id="incidentModal"
>

  <div class="modal">

    <div class="form-title">
      NEW INCIDENT
    </div>


    <div class="form-group">

      <label class="field-label">
        정황 내용
      </label>

      <input
        type="text"
        id="incidentText"
        placeholder="예: 미국 항공권 검색 정황 포착"
      />

    </div>


    <div class="form-group">

      <label class="field-label">
        출장 가능성 영향
      </label>

      <div
        style="
          display:flex;
          align-items:center;
          gap:8px;
        "
      >

        <span style="font-weight:800;">
          +
        </span>

        <input
          type="number"
          id="incidentImpact"
          value="5"
          min="0.1"
          max="100"
          step="0.1"
        />

        <span>
          %
        </span>

      </div>

    </div>


    <button
      class="register-button"
      onclick="registerIncident()"
    >
      REGISTER
    </button>


    <button
      class="close-button"
      onclick="closeIncident()"
    >
      취소
    </button>

  </div>

</div>


<script>


/* ========================================
   설정
======================================== */

const PASSWORD = "미국출장";

const STORAGE_KEY = "usBusinessTripProbability";


/* ========================================
   기본 상태
======================================== */

let data = loadData();


/* ========================================
   LocalStorage 불러오기
======================================== */

function loadData() {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (saved) {

    try {

      return JSON.parse(saved);

    } catch (error) {

      console.error(
        "저장된 데이터를 읽을 수 없습니다.",
        error
      );

    }

  }


  // 최초 접속

  return {

    score: 0,

    incidents: []

  };

}


/* ========================================
   LocalStorage 저장
======================================== */

function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* ========================================
   상태 문구
======================================== */

function getStatus(score) {

  if (score >= 100) {
    return "출장 확정";
  }

  if (score >= 85) {
    return "매우 높은 가능성";
  }

  if (score >= 70) {
    return "상당히 유력";
  }

  if (score >= 50) {
    return "가능성이 높아지고 있음";
  }

  if (score >= 30) {
    return "수상한 정황 감지";
  }

  if (score > 0) {
    return "미세한 정황이 감지됨";
  }

  return "아직 가능성은 낮음";

}


/* ========================================
   화면 업데이트
======================================== */

function updateScore() {

  const score =
    Math.min(100, data.score);


  document
    .getElementById("scoreNumber")
    .textContent =
    score.toFixed(1);


  document
    .getElementById("scoreFill")
    .style.width =
    `${score}%`;


  document
    .getElementById("scoreStatus")
    .textContent =
    getStatus(score);


  document
    .getElementById("scoreChange")
    .textContent =
    `현재까지 +${score.toFixed(1)}%`;


  if (score >= 100) {

    document
      .getElementById("confirmed")
      .classList.add("show");

  } else {

    document
      .getElementById("confirmed")
      .classList.remove("show");

  }

}


/* ========================================
   사건 목록 출력
======================================== */

function renderIncidents() {

  const list =
    document.getElementById("incidentList");


  list.innerHTML = "";


  if (data.incidents.length === 0) {

    list.innerHTML = `

      <div class="empty-state">

        아직 감지된 정황이 없습니다.

      </div>

    `;

    return;

  }


  data.incidents.forEach(
    (incident) => {

      const item =
        document.createElement("div");


      item.className =
        "incident";


      item.innerHTML = `

        <div class="incident-left">

          <div class="incident-time">
            ${escapeHtml(incident.time)}
          </div>

          <div class="incident-text">
            ${escapeHtml(incident.text)}
          </div>

        </div>

        <div class="incident-score positive">
          +${Number(incident.impact).toFixed(1)}%
        </div>

      `;


      list.appendChild(item);

    }
  );

}


/* ========================================
   HTML escape
======================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* ========================================
   인증창
======================================== */

function openAuth() {

  document
    .getElementById("authModal")
    .classList.add("show");


  document
    .getElementById("passwordInput")
    .focus();

}


function closeAuth() {

  document
    .getElementById("authModal")
    .classList.remove("show");


  document
    .getElementById("passwordInput")
    .value = "";


  document
    .getElementById("authError")
    .textContent = "";

}


/* ========================================
   인증
======================================== */

function authenticate() {

  const password =
    document
      .getElementById("passwordInput")
      .value;


  if (password === PASSWORD) {

    closeAuth();


    document
      .getElementById("incidentModal")
      .classList.add("show");


    document
      .getElementById("incidentText")
      .focus();


  } else {

    document
      .getElementById("authError")
      .textContent =
      "ACCESS DENIED";

  }

}


/* ========================================
   사건 입력창
======================================== */

function closeIncident() {

  document
    .getElementById("incidentModal")
    .classList.remove("show");


  document
    .getElementById("incidentText")
    .value = "";

}


/* ========================================
   사건 등록
======================================== */

function registerIncident() {

  const text =
    document
      .getElementById("incidentText")
      .value
      .trim();


  const impact =
    Number(
      document
        .getElementById("incidentImpact")
        .value
    );


  if (!text) {

    alert(
      "정황 내용을 입력해주세요."
    );

    return;

  }


  if (!impact || impact <= 0) {

    alert(
      "가능성 상승폭을 입력해주세요."
    );

    return;

  }


  const previousScore =
    data.score;


  const newScore =
    Math.min(
      100,
      data.score + impact
    );


  const now =
    new Date();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  const hour =
    String(
      now.getHours()
    ).padStart(2, "0");


  const minute =
    String(
      now.getMinutes()
    ).padStart(2, "0");


  const incident = {

    text: text,

    impact: impact,

    time:
      `${month}.${day} ${hour}:${minute}`

  };


  data.incidents.unshift(
    incident
  );


  data.score =
    newScore;


  saveData();


  closeIncident();


  renderIncidents();


  animateScore(
    previousScore,
    newScore
  );

}


/* ========================================
   점수 애니메이션
======================================== */

function animateScore(
  from,
  to
) {

  const duration = 1000;

  const start =
    performance.now();


  function animate(now) {

    const progress =
      Math.min(
        (now - start) / duration,
        1
      );


    const eased =
      1 -
      Math.pow(
        1 - progress,
        3
      );


    const value =
      from +
      (to - from) *
      eased;


    document
      .getElementById("scoreNumber")
      .textContent =
      value.toFixed(1);


    document
      .getElementById("scoreFill")
      .style.width =
      `${value}%`;


    if (progress < 1) {

      requestAnimationFrame(
        animate
      );

    } else {

      updateScore();

    }

  }


  requestAnimationFrame(
    animate
  );

}


/* ========================================
   초기화 인증
======================================== */

function openResetAuth() {

  const password =
    prompt(
      "데이터를 초기화하려면 비밀번호를 입력하세요."
    );


  if (password === null) {
    return;
  }


  if (password !== PASSWORD) {

    alert(
      "ACCESS DENIED"
    );

    return;

  }


  const confirmed =
    confirm(
      "모든 정황과 출장 가능성 데이터를 삭제하고 0%로 초기화하시겠습니까?"
    );


  if (!confirmed) {
    return;
  }


  localStorage.removeItem(
    STORAGE_KEY
  );


  data = {

    score: 0,

    incidents: []

  };


  updateScore();

  renderIncidents();

}


/* ========================================
   모달 외부 클릭
======================================== */

document
  .getElementById("authModal")
  .addEventListener(
    "click",
    function(e) {

      if (e.target === this) {

        closeAuth();

      }

    }
  );


document
  .getElementById("incidentModal")
  .addEventListener(
    "click",
    function(e) {

      if (e.target === this) {

        closeIncident();

      }

    }
  );


/* ========================================
   초기 실행
======================================== */

updateScore();

renderIncidents();

</script>

</body>
</html>
