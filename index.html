<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>미국 출장 가능성 지표</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #17191c;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        sans-serif;
    }

    .container {
      width: min(760px, calc(100% - 32px));
      margin: auto;
      padding: 60px 0 80px;
    }

    .header {
      margin-bottom: 28px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      color: #777;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -.04em;
    }

    /* SCORE */

    .score-card {
      background: #fff;
      border: 1px solid #e2e4e7;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
    }

    .score-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .score {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .score-number {
      font-size: 82px;
      font-weight: 800;
      letter-spacing: -.07em;
      line-height: 1;
    }

    .score-percent {
      font-size: 30px;
      font-weight: 700;
    }

    .score-bar {
      height: 12px;
      background: #e8eaed;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 24px;
    }

    .score-fill {
      height: 100%;
      width: 0%;
      background: #17191c;
      border-radius: 20px;
    }

    .score-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    .status {
      font-size: 14px;
      font-weight: 700;
    }

    .change {
      color: #777;
      font-size: 13px;
    }

    /* INCIDENTS */

    .section {
      margin-top: 32px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .incident-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .incident {
      background: #fff;
      border: 1px solid #e2e4e7;
      border-radius: 14px;
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      animation: incidentIn .3s ease-out;
    }

    @keyframes incidentIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .incident-left {
      min-width: 0;
    }

    .incident-time {
      font-size: 11px;
      color: #999;
      margin-bottom: 5px;
    }

    .incident-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .incident-score {
      white-space: nowrap;
      font-size: 14px;
      font-weight: 800;
    }

    .empty-state {
      background: #fff;
      border: 1px solid #e2e4e7;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    /* BUTTON */

    .add-button {
      width: 100%;
      margin-top: 12px;
      padding: 17px;
      border: 1px dashed #b8bbc0;
      background: transparent;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #555;
      transition: .2s;
    }

    .add-button:hover {
      background: #fff;
      border-color: #777;
    }

    /* RESET */

    .reset-area {
      text-align: center;
      margin-top: 25px;
    }

    .reset-button {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* MODAL */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(400px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 25px 80px rgba(0,0,0,.2);
      animation: modalIn .2s ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .lock {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .modal h2 {
      margin: 0;
      font-size: 20px;
    }

    .modal-description {
      margin: 8px 0 24px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 1px solid #d7d9dd;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .auth-button,
    .register-button {
      width: 100%;
      border: 0;
      background: #17191c;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      margin-top: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .auth-error {
      height: 18px;
      margin-top: 8px;
      font-size: 12px;
      color: #c62828;
    }

    .close-button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 10px;
      margin-top: 4px;
      color: #888;
      cursor: pointer;
    }

    /* CONFIRMED */

    .confirmed {
      display: none;
      margin-top: 28px;
      padding: 28px;
      border-radius: 16px;
      background: #17191c;
      color: #fff;
      text-align: center;
    }

    .confirmed.show {
      display: block;
    }

    .confirmed-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .confirmed-title {
      font-size: 22px;
      font-weight: 800;
    }

    .confirmed-text {
      margin-top: 8px;
      font-size: 13px;
      color: #bbb;
    }

    /* LOADING */

    .loading {
      color: #999;
      font-size: 13px;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 600px) {

      .container {
        padding-top: 35px;
      }

      .score-card {
        padding: 28px;
      }

      .score-number {
        font-size: 64px;
      }

      .incident {
        padding: 15px;
      }

    }
  </style>
</head>


<body>

<main class="container">

  <header class="header">

    <div class="eyebrow">
      CONFIDENTIAL / INTERNAL ANALYSIS
    </div>

    <h1>
      🇺🇸 미국 출장 가능성 지표
    </h1>

  </header>


  <!-- SCORE -->

  <section class="score-card">

    <div class="score-label">
      현재 미국 출장 가능성
    </div>

    <div class="score">

      <div
        class="score-number"
        id="scoreNumber"
      >
        0.0
      </div>

      <div class="score-percent">
        %
      </div>

    </div>


    <div class="score-bar">

      <div
        class="score-fill"
        id="scoreFill"
      ></div>

    </div>


    <div class="score-status">

      <div
        class="status"
        id="scoreStatus"
      >
        아직 가능성은 낮음
      </div>

      <div
        class="change"
        id="scoreChange"
      >
        현재까지 +0.0%
      </div>

    </div>

  </section>


  <!-- INCIDENTS -->

  <section class="section">

    <div class="section-title">
      최근 감지된 정황
    </div>

    <div
      class="incident-list"
      id="incidentList"
    >
      <div class="loading">
        데이터 불러오는 중...
      </div>
    </div>

    <button
      class="add-button"
      id="addButton"
    >
      ＋ 새로운 정황 추가
    </button>

  </section>


  <!-- CONFIRMED -->

  <div
    class="confirmed"
    id="confirmed"
  >

    <div class="confirmed-icon">
      🇺🇸✈️
    </div>

    <div class="confirmed-title">
      미국 출장 확정
    </div>

    <div class="confirmed-text">
      더 이상의 분석이 필요하지 않습니다.
    </div>

  </div>


  <!-- RESET -->

  <div class="reset-area">

    <button
      class="reset-button"
      id="resetButton"
    >
      데이터 초기화
    </button>

  </div>

</main>


<!-- PASSWORD MODAL -->

<div
  class="modal-backdrop"
  id="authModal"
>

  <div class="modal">

    <div class="lock">
      🔒
    </div>

    <h2>
      ACCESS REQUIRED
    </h2>

    <div class="modal-description">
      새로운 정황을 등록하려면<br>
      인증이 필요합니다.
    </div>

    <label class="field-label">
      PASSWORD
    </label>

    <input
      type="password"
      id="passwordInput"
      autocomplete="off"
    >

    <div
      class="auth-error"
      id="authError"
    ></div>

    <button
      class="auth-button"
      id="authButton"
    >
      인증
    </button>

    <button
      class="close-button"
      id="authCloseButton"
    >
      취소
    </button>

  </div>

</div>


<!-- INCIDENT MODAL -->

<div
  class="modal-backdrop"
  id="incidentModal"
>

  <div class="modal">

    <div style="
      font-size:20px;
      font-weight:800;
      margin-bottom:22px;
    ">
      NEW INCIDENT
    </div>


    <label class="field-label">
      정황 내용
    </label>

    <input
      type="text"
      id="incidentText"
      placeholder="예: 미국 항공권 검색 정황 포착"
    >


    <label
      class="field-label"
      style="margin-top:18px;"
    >
      출장 가능성 영향
    </label>

    <div style="
      display:flex;
      align-items:center;
      gap:8px;
    ">

      <span style="font-weight:800;">
        +
      </span>

      <input
        type="number"
        id="incidentImpact"
        value="5"
        min="0.1"
        max="100"
        step="0.1"
      >

      <span>
        %
      </span>

    </div>


    <button
      class="register-button"
      id="registerButton"
    >
      REGISTER
    </button>


    <button
      class="close-button"
      id="incidentCloseButton"
    >
      취소
    </button>

  </div>

</div>


<script type="module">

  /* ========================================
     FIREBASE
  ======================================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyD7_7fubG9jj2lYE803_bQbgLO5Yl_0ENV8",

    authDomain:
      "sttaaarrttt.firebaseapp.com",

    projectId:
      "sttaaarrttt",

    storageBucket:
      "sttaaarrttt.firebasestorage.app",

    messagingSenderId:
      "177267691380",

    appId:
      "1:177267691380:web:2c182032c0e6e9220e6621",

    measurementId:
      "G-XDW12S3LVY"

  };


  const app =
    initializeApp(firebaseConfig);


  const db =
    getFirestore(app);


  /* ========================================
     설정
  ======================================== */

  const PASSWORD = "alrnrcnfwkd";


  /* ========================================
     DOM
  ======================================== */

  const scoreNumber =
    document.getElementById("scoreNumber");

  const scoreFill =
    document.getElementById("scoreFill");

  const scoreStatus =
    document.getElementById("scoreStatus");

  const scoreChange =
    document.getElementById("scoreChange");

  const incidentList =
    document.getElementById("incidentList");

  const confirmed =
    document.getElementById("confirmed");


  /* ========================================
     상태
  ======================================== */

  let currentScore = 0;

  let incidents = [];


  /* ========================================
     상태 문구
  ======================================== */

  function getStatus(score) {

    if (score >= 100)
      return "출장 확정";

    if (score >= 85)
      return "매우 높은 가능성";

    if (score >= 70)
      return "상당히 유력";

    if (score >= 50)
      return "가능성이 높아지고 있음";

    if (score >= 30)
      return "수상한 정황 감지";

    if (score > 0)
      return "미세한 정황이 감지됨";

    return "아직 가능성은 낮음";

  }


  /* ========================================
     점수 화면
  ======================================== */

  function updateScore(
    animateFrom = null
  ) {

    const target =
      Math.min(100, currentScore);


    if (
      animateFrom !== null &&
      animateFrom !== target
    ) {

      animateScore(
        animateFrom,
        target
      );

    } else {

      scoreNumber.textContent =
        target.toFixed(1);

      scoreFill.style.width =
        `${target}%`;

    }


    scoreStatus.textContent =
      getStatus(target);


    scoreChange.textContent =
      `현재까지 +${target.toFixed(1)}%`;


    if (target >= 100) {

      confirmed.classList.add(
        "show"
      );

    } else {

      confirmed.classList.remove(
        "show"
      );

    }

  }


  /* ========================================
     숫자 애니메이션
  ======================================== */

  function animateScore(
    from,
    to
  ) {

    const duration = 900;

    const start =
      performance.now();


    function frame(now) {

      const progress =
        Math.min(
          (now - start) / duration,
          1
        );


      const eased =
        1 -
        Math.pow(
          1 - progress,
          3
        );


      const value =
        from +
        (to - from) *
        eased;


      scoreNumber.textContent =
        value.toFixed(1);


      scoreFill.style.width =
        `${value}%`;


      if (progress < 1) {

        requestAnimationFrame(
          frame
        );

      }

    }


    requestAnimationFrame(frame);

  }


  /* ========================================
     HTML escape
  ======================================== */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  /* ========================================
     날짜
  ======================================== */

  function formatDate(timestamp) {

    if (!timestamp) {
      return "방금 전";
    }


    const date =
      timestamp.toDate();


    const month =
      String(
        date.getMonth() + 1
      ).padStart(2, "0");


    const day =
      String(
        date.getDate()
      ).padStart(2, "0");


    const hour =
      String(
        date.getHours()
      ).padStart(2, "0");


    const minute =
      String(
        date.getMinutes()
      ).padStart(2, "0");


    return `${month}.${day} ${hour}:${minute}`;

  }


  /* ========================================
     사건 목록
  ======================================== */

  function renderIncidents() {

    incidentList.innerHTML = "";


    if (incidents.length === 0) {

      incidentList.innerHTML = `

        <div class="empty-state">
          아직 감지된 정황이 없습니다.
        </div>

      `;

      return;

    }


    incidents.forEach(
      incident => {

        const item =
          document.createElement("div");


        item.className =
          "incident";


        item.innerHTML = `

          <div class="incident-left">

            <div class="incident-time">
              ${formatDate(
                incident.createdAt
              )}
            </div>

            <div class="incident-text">
              ${escapeHtml(
                incident.text
              )}
            </div>

          </div>

          <div class="incident-score">
            +${Number(
              incident.impact
            ).toFixed(1)}%
          </div>

        `;


        incidentList.appendChild(
          item
        );

      }
    );

  }


  /* ========================================
     FIRESTORE 실시간 감시
  ======================================== */

  const incidentsQuery =
    query(
      collection(
        db,
        "incidents"
      ),
      orderBy(
        "createdAt",
        "desc"
      )
    );


  let firstLoad = true;


  onSnapshot(
    incidentsQuery,
    snapshot => {

      const oldScore =
        currentScore;


      incidents =
        snapshot.docs.map(
          doc => ({

            id: doc.id,

            ...doc.data()

          })
        );


      currentScore =
        incidents.reduce(
          (
            total,
            incident
          ) =>
            total +
            Number(
              incident.impact || 0
            ),
          0
        );


      currentScore =
        Math.min(
          100,
          currentScore
        );


      renderIncidents();


      if (firstLoad) {

        updateScore();

        firstLoad = false;

      } else {

        updateScore(
          oldScore
        );

      }

    },

    error => {

      console.error(
        "Firestore error:",
        error
      );


      incidentList.innerHTML = `

        <div class="empty-state">
          데이터를 불러오지 못했습니다.
        </div>

      `;

    }

  );


  /* ========================================
     인증 모달
  ======================================== */

  const authModal =
    document.getElementById(
      "authModal"
    );


  const incidentModal =
    document.getElementById(
      "incidentModal"
    );


  const passwordInput =
    document.getElementById(
      "passwordInput"
    );


  const authError =
    document.getElementById(
      "authError"
    );


  document
    .getElementById("addButton")
    .addEventListener(
      "click",
      () => {

        authModal.classList.add(
          "show"
        );

        passwordInput.focus();

      }
    );


  function closeAuth() {

    authModal.classList.remove(
      "show"
    );

    passwordInput.value = "";

    authError.textContent = "";

  }


  document
    .getElementById(
      "authCloseButton"
    )
    .addEventListener(
      "click",
      closeAuth
    );


  /* ========================================
     비밀번호
  ======================================== */

  function authenticate() {

    if (
      passwordInput.value ===
      PASSWORD
    ) {

      closeAuth();


      incidentModal.classList.add(
        "show"
      );


      document
        .getElementById(
          "incidentText"
        )
        .focus();


    } else {

      authError.textContent =
        "ACCESS DENIED";

    }

  }


  document
    .getElementById("authButton")
    .addEventListener(
      "click",
      authenticate
    );


  passwordInput
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          authenticate();

        }

      }
    );


  /* ========================================
     사건 등록창 닫기
  ======================================== */

  function closeIncident() {

    incidentModal.classList.remove(
      "show"
    );

    document
      .getElementById(
        "incidentText"
      )
      .value = "";

  }


  document
    .getElementById(
      "incidentCloseButton"
    )
    .addEventListener(
      "click",
      closeIncident
    );


  /* ========================================
     사건 등록
  ======================================== */

  document
    .getElementById(
      "registerButton"
    )
    .addEventListener(
      "click",
      async () => {

        const text =
          document
            .getElementById(
              "incidentText"
            )
            .value
            .trim();


        const impact =
          Number(
            document
              .getElementById(
                "incidentImpact"
              )
              .value
          );


        if (!text) {

          alert(
            "정황 내용을 입력해주세요."
          );

          return;

        }


        if (
          !impact ||
          impact <= 0
        ) {

          alert(
            "가능성 상승폭을 입력해주세요."
          );

          return;

        }


        const button =
          document.getElementById(
            "registerButton"
          );


        button.disabled = true;

        button.textContent =
          "REGISTERING...";


        try {

          await addDoc(
            collection(
              db,
              "incidents"
            ),
            {

              text: text,

              impact: impact,

              createdAt:
                serverTimestamp()

            }
          );


          closeIncident();


        } catch (error) {

          console.error(
            error
          );


          alert(
            "정황 등록에 실패했습니다."
          );

        }


        button.disabled = false;

        button.textContent =
          "REGISTER";

      }
    );


  /* ========================================
     초기화
  ======================================== */

  document
    .getElementById(
      "resetButton"
    )
    .addEventListener(
      "click",
      () => {

        const password =
          prompt(
            "데이터를 초기화하려면 비밀번호를 입력하세요."
          );


        if (
          password !== PASSWORD
        ) {

          if (
            password !== null
          ) {

            alert(
              "ACCESS DENIED"
            );

          }

          return;

        }


        alert(
          "초기화 기능은 현재 Firebase 보안상 비활성화되어 있습니다."
        );

      }
    );


  /* ========================================
     모달 바깥 클릭
  ======================================== */

  authModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        authModal
      ) {

        closeAuth();

      }

    }
  );


  incidentModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        incidentModal
      ) {

        closeIncident();

      }

    }
  );

</script>
